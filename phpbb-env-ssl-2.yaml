apiVersion: '2023-05-01'
location: koreacentral
name: phpbb-container-kr
identity: 
  type: UserAssigned
  userAssignedIdentities: {
    '/subscriptions/570a1e43-d63b-4dee-8549-4dfecb870e90/resourcegroups/towang-forum/providers/Microsoft.ManagedIdentity/userAssignedIdentities/phpbb_id': {}
    }
properties:
  osType: Linux
  imageRegistryCredentials:
  - server: phpbb.azurecr.io
    identity: '/subscriptions/570a1e43-d63b-4dee-8549-4dfecb870e90/resourcegroups/towang-forum/providers/Microsoft.ManagedIdentity/userAssignedIdentities/phpbb_id'
  restartPolicy: OnFailure
  containers:
    - name: phpbb
      properties:
        environmentVariables:
          - name: 'PHPBB_SITE_ADDRESS'
            value: 'wowang.net, www.wowang.net'
          - name: 'PHPBB_DB_DRIVER'
            value: 'mysqli'
          - name: 'PHPBB_DB_HOST'
            value: 'phpbb-kr-db.mysql.database.azure.com'
          - name: 'PHPBB_DB_PORT'
            value: '3306'
          - name: 'PHPBB_DB_NAME'
            value: 'phpbb'
          - name: 'PHPBB_DB_USER'
            value: 'towang'
          - name: 'PHPBB_DB_PASSWD'
            secureValue: '...'
        image: phpbb.azurecr.io/wonglae/phpbb:3.3.17
        ports:
          - protocol: TCP
            port: 443
          - protocol: TCP
            port: 80
          - protocol: TCP
            port: 8080
        resources:
          requests:
            cpu: 1
            memoryInGB: 2
          limits:
            cpu: 1
            memoryInGB: 2
        volumeMounts:
          - mountPath: /phpbb/www/aci/phpbb-upload/
            name: fileuploadvolume
          - mountPath: /phpbb/www/aci/phpbb-storage/
            name: filesharevolume
          - name: proxy-data
            mountPath: /root/.local/share/caddy
          - name: proxy-config
            mountPath: /root/.config/caddy
  ipAddress:
    type: Public
    ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 80
    dnsNameLabel: phpbb-container-kr
  volumes:
    - name: proxy-data
      azureFile: 
        shareName: proxy-data
        storageAccountName: phpbbstg
        storageAccountKey: ...
    - name: proxy-config
      azureFile: 
        shareName: proxy-config
        storageAccountName: phpbbstg
        storageAccountKey: ...
    - name: filesharevolume
      azureFile:
        shareName: phpbb-storage
        storageAccountName: phpbbstg
        storageAccountKey: ...
    - name: fileuploadvolume
      azureFile:
        shareName: phpbb-upload
        storageAccountName: phpbbstg
        storageAccountKey: ...
tags: null
type: Microsoft.ContainerInstance/containerGroups
